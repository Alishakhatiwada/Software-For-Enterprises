
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | The Lost Library</title>
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/auth.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <a href="index.html" class="back-link">← Back to the Library</a>

        <section class="auth-card">
            <div class="book-icon">🗝️</div>
            <p class="eyebrow">BEGIN YOUR ADVENTURE</p>
            <h1>Create Your Account</h1>
            <p class="subtitle">
                Open the door to a world of forgotten stories.
            </p>

            <form id="registerForm">
                <label for="registerName">Your Name</label>
                <input
                    type="text"
                    id="registerName"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    maxlength="80"
                    required
                >

                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" id="registerButton">
                    Create My Account
                </button>

                <p id="registerMessage" class="form-message" role="status"
                   aria-live="polite"></p>
            </form>

            <p class="switch-page">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>
        </section>

        <p class="footer-text">Your next chapter begins here.</p>
    </main>
</body>
</html>
