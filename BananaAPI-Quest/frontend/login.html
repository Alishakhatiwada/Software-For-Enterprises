<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BananaAPI-Quest</title>

    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js" defer></script>
</head>
<body>
    <main class="auth-container">

        <a href="register.html" class="back-link">
            ← Create an Account
        </a>

        <section class="auth-card">
            <div class="book-icon">🍌</div>

            <p class="eyebrow">READY FOR A CHALLENGE?</p>

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Log in to solve puzzles, test your skills,
                and track your progress.
            </p>

            <form id="loginForm">

                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">
                    Start Playing
                </button>

                <p
                    id="loginMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

            <p class="switch-page">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </section>

        <p class="footer-text">
            Think carefully. Solve the puzzle. Beat your best score!
        </p>

    </main>
</body>
</html>
