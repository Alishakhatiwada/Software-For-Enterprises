<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BananaAPI-Quest</title>
    <link rel="stylesheet" href="css/register.css">
    <script src="js/register.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <a href="login.html" class="back-link">← Back to Login</a>

        <section class="auth-card">
            <div class="book-icon">🗝️</div>
            <p class="eyebrow">BEGIN YOUR ADVENTURE</p>

            <h1>Create Your Account</h1>

            <p class="subtitle">
                Create an account to begin your BananaAPI-Quest adventure.
            </p>

            <form id="registerForm">
                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    maxlength="80"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" id="registerButton">
                    Create My Account
                </button>

                <p
                    id="message"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>

            <p class="switch-page">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>
        </section>

        <p class="footer-text">Your next challenge awaits.</p>
    </main>
</body>
</html>
